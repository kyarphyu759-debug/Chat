<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatSphere - Real-time Direct Messenger</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; -webkit-tap-highlight-color: transparent; }
    .hidden { display: none !important; }

    #chat-app { display: flex; width: 100vw; height: 100vh; max-width: 1100px; background: #1e293b; overflow: hidden; position: relative; }

    @media (min-width: 768px) {
      #chat-app { height: 85vh; width: 90vw; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    }

    /* Sidebar */
    .sidebar { width: 100%; background: #0f172a; padding: 1rem; border-right: 1px solid #334155; display: flex; flex-direction: column; z-index: 2; height: 100%; }
    @media (min-width: 768px) {
      .sidebar { width: 320px; }
    }
    
    .my-profile-info { background: #1e293b; padding: 0.8rem 1rem; border-radius: 8px; margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: center; border: 1px solid #334155; }
    .my-profile-info h4 { color: #94a3b8; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.5px; }
    .my-profile-info p { color: #38bdf8; font-weight: bold; font-size: 1rem; }

    .users-list { flex: 1; overflow-y: auto; }
    .users-list h3 { font-size: 0.8rem; color: #94a3b8; margin-bottom: 0.75rem; display: flex; justify-content: space-between; align-items: center; }
    
    .user-item { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.5rem; font-size: 0.9rem; background: #1e293b; padding: 8px 12px; border-radius: 8px; cursor: pointer; transition: 0.2s; border: 1px solid transparent; }
    .user-item:hover { background: #334155; }
    .user-item.active { background: #1e3a8a; border-color: #38bdf8; }
    
    .user-info-group { display: flex; align-items: center; gap: 10px; overflow: hidden; }
    .user-name { font-weight: 600; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; color: #f1f5f9; }
    .status-dot { width: 8px; height: 8px; background: #22c55e; border-radius: 50%; box-shadow: 0 0 6px #22c55e; flex-shrink: 0; }
    .status-dot.offline { background: #94a3b8; box-shadow: none; }

    /* Chat Area */
    .chat-area { flex: 1; display: flex; flex-direction: column; position: absolute; top:0; left:0; width:100%; height:100%; background: #1e293b; z-index: 1; transition: transform 0.3s ease; }
    
    @media (min-width: 768px) {
      .chat-area { position: relative; width: auto; z-index: 1; }
    }

    .chat-area.active-mobile { z-index: 3; }

    .chat-header { padding: 0.8rem 1rem; background: #0f172a; border-bottom: 1px solid #334155; display: flex; align-items: center; gap: 10px; position: relative; }
    .back-btn { background: none; border: none; color: #38bdf8; font-size: 1.2rem; cursor: pointer; display: block; padding: 0 5px; }
    @media (min-width: 768px) { .back-btn { display: none; } }

    .target-title { font-size: 0.95rem; font-weight: bold; color: #f8fafc; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .header-right-group { display: flex; align-items: center; gap: 12px; }
    .online-badge { font-size: 0.75rem; color: #22c55e; white-space: nowrap; }
    .online-badge.offline { color: #94a3b8; }
    .chat-menu-btn { background: none; border: none; color: #94a3b8; font-size: 1.2rem; cursor: pointer; padding: 2px 6px; border-radius: 4px; line-height: 1; }
    .chat-menu-btn:hover { color: #f8fafc; background: #334155; }

    .chat-dropdown-menu {
      position: absolute;
      top: 100%;
      right: 1rem;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      z-index: 100;
      display: flex;
      flex-direction: column;
      min-width: 170px;
      overflow: hidden;
    }
    .chat-dropdown-menu button {
      background: none;
      border: none;
      color: #f8fafc;
      padding: 10px 14px;
      text-align: left;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .chat-dropdown-menu button:hover { background: #334155; }

    .messages-container { flex: 1; padding: 1rem; overflow-y: auto; display: flex; flex-direction: column; gap: 0.75rem; background: #1e293b; background-size: cover; background-position: center; }
    
    .message { 
      max-width: 80%; 
      padding: 0.6rem 0.9rem; 
      border-radius: 12px; 
      background: #334155; 
      align-self: flex-start; 
      word-wrap: break-word; 
      direction: ltr !important; 
      text-align: left !important;
      font-size: 0.9rem;
      user-select: none;
      cursor: pointer;
      position: relative;
    }
    @media (min-width: 768px) { .message { max-width: 65%; } }
    .message.mine { background: #2563eb; align-self: flex-end; }
    
    .msg-meta { font-size: 0.7rem; color: #cbd5e1; margin-bottom: 0.2rem; display: flex; justify-content: space-between; gap: 0.8rem; }
    .msg-time { opacity: 0.75; display: flex; align-items: center; gap: 3px; }
    
    /* Message Status Checkmarks */
    .read-status { font-weight: bold; font-size: 0.8rem; }
    .read-status.sent { color: #94a3b8; }
    .read-status.read { color: #38bdf8; }

    .msg-text {
      direction: ltr !important;
      unicode-bidi: isolate !important;
      text-align: left !important;
      white-space: pre-wrap;
      line-height: 1.3;
    }

    .reactions-badge-container {
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
      margin-top: 4px;
    }
    .reaction-badge {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid #475569;
      border-radius: 12px;
      padding: 1px 6px;
      font-size: 0.75rem;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      cursor: pointer;
      backdrop-filter: blur(4px);
    }
    .reaction-badge.my-reaction {
      border-color: #38bdf8;
      background: rgba(30, 58, 138, 0.8);
    }

    .reply-quote {
      background: rgba(0, 0, 0, 0.2);
      border-left: 3px solid #38bdf8;
      padding: 4px 8px;
      border-radius: 4px;
      margin-bottom: 6px;
      font-size: 0.78rem;
      color: #e2e8f0;
    }
    .reply-quote strong { color: #38bdf8; display: block; font-size: 0.7rem; }

    .input-wrapper { background: #0f172a; border-top: 1px solid #334155; display: flex; flex-direction: column; }
    
    .reply-preview-bar {
      background: #1e293b;
      padding: 6px 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-left: 4px solid #38bdf8;
      font-size: 0.8rem;
    }
    .reply-preview-content { color: #cbd5e1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 85%; }
    .close-reply-btn { background: none; border: none; color: #ef4444; font-weight: bold; cursor: pointer; font-size: 1rem; }

    .input-area { padding: 0.75rem 1rem; display: flex; gap: 8px; }
    input { flex: 1; padding: 0.65rem 0.8rem; border: 1px solid #334155; border-radius: 6px; background: #1e293b; color: #fff; font-size: 0.9rem; outline: none; }
    input:focus { border-color: #38bdf8; }
    button.send-btn { padding: 0.65rem 1.2rem; background: #2563eb; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    
    .edit-profile-btn { background: #334155; color: #38bdf8; border: 1px solid #38bdf8; padding: 0.3rem 0.6rem; border-radius: 6px; font-size: 0.75rem; cursor: pointer; }

    .no-chat-selected { display: flex; height: 100%; justify-content: center; align-items: center; color: #64748b; font-size: 0.95rem; text-align: center; padding: 1rem; }

    /* Context Menu & Reactions Bar */
    .context-menu {
      position: fixed;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      z-index: 2000;
      display: flex;
      flex-direction: column;
      min-width: 150px;
      overflow: hidden;
    }
    .reaction-picker {
      display: flex;
      justify-content: space-around;
      padding: 8px;
      background: #1e293b;
      border-bottom: 1px solid #334155;
    }
    .reaction-picker span {
      font-size: 1.25rem;
      cursor: pointer;
      transition: transform 0.15s ease;
      padding: 2px 4px;
      border-radius: 50%;
    }
    .reaction-picker span:hover {
      transform: scale(1.3);
      background: #334155;
    }
    .context-menu button {
      background: none;
      border: none;
      color: #f8fafc;
      padding: 10px 14px;
      text-align: left;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .context-menu button:hover { background: #334155; }
    .context-menu button.danger { color: #ef4444; }

    /* Modal */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.7); display: flex; justify-content: center; align-items: center; z-index: 1000; }
    .modal-card { background: #1e293b; padding: 1.5rem; border-radius: 12px; width: 90%; max-width: 380px; }
    .modal-card h3 { color: #38bdf8; margin-bottom: 0.8rem; font-size: 1.1rem; }
    .modal-card label { display: block; font-size: 0.8rem; color: #94a3b8; margin-bottom: 0.3rem; }
    .modal-card input { margin-bottom: 1rem; width: 100%; }
    .modal-actions { display: flex; gap: 8px; }
    .cancel-btn { background: #475569; border: none; color: white; padding: 0.6rem; border-radius: 6px; cursor: pointer; }
  </style>
</head>
<body>

  <div id="chat-app">
    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
      <div class="my-profile-info">
        <div>
          <h4>MY PROFILE</h4>
          <p id="display-my-username">Guest</p>
        </div>
        <button id="open-profile-btn" class="edit-profile-btn">⚙️ Edit</button>
      </div>
      
      <div class="users-list">
        <h3>
          <span>GLOBAL ONLINE USERS</span>
          <span id="user-count" style="color:#38bdf8;">0</span>
        </h3>
        <div id="users-container"></div>
      </div>
    </div>

    <!-- Chat Area -->
    <div class="chat-area" id="chat-area">
      <div class="chat-header">
        <button class="back-btn" id="back-to-users-btn">⬅️</button>
        <div class="target-title" id="target-username">ကျေးဇူးပြု၍ စာပို့ချင်သည့် User ကို ရွေးချယ်ပါ</div>
        
        <div class="header-right-group">
          <span class="online-badge" id="online-status-badge">● online</span>
          <button class="chat-menu-btn" id="chat-menu-btn" title="Options">☰</button>
        </div>

        <div id="chat-dropdown-menu" class="chat-dropdown-menu hidden">
          <button id="menu-set-nickname">✏️ Set nickname</button>
          <button id="menu-change-bg">🎨 Change background</button>
        </div>
      </div>

      <div class="messages-container" id="messages-container">
        <div class="no-chat-selected" id="no-chat-msg">👈 ဘေးဘက် Online Users စာရင်းမှ ပို့ချင်သောသူကို နှိပ်ပါ။</div>
      </div>

      <div class="input-wrapper hidden" id="input-wrapper">
        <div class="reply-preview-bar hidden" id="reply-preview-bar">
          <div class="reply-preview-content" id="reply-preview-text"></div>
          <button class="close-reply-btn" id="cancel-reply-btn">✕</button>
        </div>
        <form class="input-area" id="chat-form">
          <input type="text" id="message-input" placeholder="စာတို ရိုက်ထည့်ပါ..." autocomplete="off" />
          <button type="submit" class="send-btn">Send</button>
        </form>
      </div>
    </div>
  </div>

  <!-- Context Menu with Reaction Options -->
  <div id="context-menu" class="context-menu hidden">
    <div class="reaction-picker" id="reaction-picker">
      <span data-emoji="❤️">❤️</span>
      <span data-emoji="😆">😆</span>
      <span data-emoji="😮">😮</span>
      <span data-emoji="😢">😢</span>
      <span data-emoji="👍">👍</span>
      <span data-emoji="🙏">🙏</span>
    </div>
    <button id="ctx-reply-btn">↩️ Reply</button>
    <button id="ctx-edit-btn">✏️ Edit</button>
    <button id="ctx-delete-btn" class="danger">🗑️ Delete</button>
  </div>

  <!-- Profile Modal -->
  <div id="profile-modal" class="modal-overlay hidden">
    <div class="modal-card">
      <h3>User Name ပြောင်းလဲရန်</h3>
      <label>User Name</label>
      <input type="text" id="modal-username-input" placeholder="Username အသစ်..." required />
      <div class="modal-actions">
        <button type="button" id="save-profile-btn" style="flex: 1; background:#2563eb; color:white; border:none; border-radius:6px; cursor:pointer;">Save Changes</button>
        <button type="button" id="close-modal-btn" class="cancel-btn">Cancel</button>
      </div>
    </div>
  </div>

  <!-- FIREBASE SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDbrOZ_ro3YrBxpnHb3icXUxzuLTqtYCZo", 
      authDomain: "chat-20ea2.firebaseapp.com",
      databaseURL: "https://chat-20ea2-default-rtdb.firebaseio.com",
      projectId: "chat-20ea2",
      storageBucket: "chat-20ea2.appspot.com",
      messagingSenderId: "237395870913",
      appId: "1:237395870913:web:ea718b60cef5a5354e4040",
      measurementId: "G-TR1DR12NSV"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    let myClientId = localStorage.getItem('chatsphere_client_id');
    if (!myClientId) {
      myClientId = 'usr_' + Math.random().toString(36).substr(2, 9);
      localStorage.setItem('chatsphere_client_id', myClientId);
    }

    let currentUsername = localStorage.getItem('chatsphere_username') || ('Guest_' + myClientId.substr(-4));
    let selectedTargetUser = null; 
    let activeChatRoomId = null;

    function getStoredObject(key) {
      try {
        const data = JSON.parse(localStorage.getItem(key));
        return (data && typeof data === 'object') ? data : {};
      } catch (e) {
        return {};
      }
    }

    let nicknames = getStoredObject('chatsphere_nicknames');
    let latestUsersList = [];

    // Active Action Variables
    let selectedMsgData = null;
    let selectedMsgKey = null;
    let activeReplyData = null;

    // DOM Elements
    const displayMyUsername = document.getElementById('display-my-username');
    const usersContainer = document.getElementById('users-container');
    const userCountEl = document.getElementById('user-count');
    const targetUsernameEl = document.getElementById('target-username');
    const onlineStatusBadge = document.getElementById('online-status-badge');
    const messagesContainer = document.getElementById('messages-container');
    const noChatMsg = document.getElementById('no-chat-msg');
    const inputWrapper = document.getElementById('input-wrapper');
    const chatForm = document.getElementById('chat-form');
    const messageInput = document.getElementById('message-input');
    const chatArea = document.getElementById('chat-area');
    const backToUsersBtn = document.getElementById('back-to-users-btn');

    const replyPreviewBar = document.getElementById('reply-preview-bar');
    const replyPreviewText = document.getElementById('reply-preview-text');
    const cancelReplyBtn = document.getElementById('cancel-reply-btn');

    const contextMenu = document.getElementById('context-menu');
    const reactionPicker = document.getElementById('reaction-picker');
    const ctxReplyBtn = document.getElementById('ctx-reply-btn');
    const ctxEditBtn = document.getElementById('ctx-edit-btn');
    const ctxDeleteBtn = document.getElementById('ctx-delete-btn');

    const profileModal = document.getElementById('profile-modal');
    const openProfileBtn = document.getElementById('open-profile-btn');
    const closeModalBtn = document.getElementById('close-modal-btn');
    const saveProfileBtn = document.getElementById('save-profile-btn');
    const modalUsernameInput = document.getElementById('modal-username-input');

    const chatMenuBtn = document.getElementById('chat-menu-btn');
    const chatDropdownMenu = document.getElementById('chat-dropdown-menu');
    const menuSetNickname = document.getElementById('menu-set-nickname');
    const menuChangeBg = document.getElementById('menu-change-bg');

    // Load saved background
    const savedBg = localStorage.getItem('chatsphere_chat_bg');
    if (savedBg) {
      if (savedBg.startsWith('http') || savedBg.startsWith('data:')) {
        messagesContainer.style.backgroundImage = `url('${savedBg}')`;
      } else {
        messagesContainer.style.background = savedBg;
      }
    }

    // STARTUP
    window.addEventListener('DOMContentLoaded', async () => {
      try {
        if (!auth.currentUser) {
          await auth.signInAnonymously();
        }
        displayMyUsername.textContent = currentUsername;
        initGlobalPresence();
      } catch (error) {
        console.error("Auth Error:", error);
      }
    });

    backToUsersBtn.addEventListener('click', () => {
      chatArea.classList.remove('active-mobile');
    });

    chatMenuBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      chatDropdownMenu.classList.toggle('hidden');
    });

    menuSetNickname.addEventListener('click', () => {
      chatDropdownMenu.classList.add('hidden');
      if (!selectedTargetUser) {
        alert("ကျေးဇူးပြု၍ User တစ်ယောက်ကို အရင် ရွေးချယ်ပါ!");
        return;
      }

      const currentNick = nicknames[selectedTargetUser.id] || selectedTargetUser.name;
      const newNickname = prompt(`"${selectedTargetUser.name}" အတွက် Nickname သတ်မှတ်ပါ:`, currentNick);

      if (newNickname !== null) {
        if (newNickname.trim() === '') {
          delete nicknames[selectedTargetUser.id];
        } else {
          nicknames[selectedTargetUser.id] = newNickname.trim();
        }
        localStorage.setItem('chatsphere_nicknames', JSON.stringify(nicknames));
        
        const displayName = nicknames[selectedTargetUser.id] || selectedTargetUser.name;
        targetUsernameEl.textContent = `💬 ${displayName} နှင့် စာပို့နေပါသည်`;
        renderUsersUI();
      }
    });

    menuChangeBg.addEventListener('click', () => {
      chatDropdownMenu.classList.add('hidden');
      const bgInput = prompt("Background အတွက် Color Code (ဥပမာ #0f172a) သို့မဟုတ် Image URL ထည့်ပါ:\n(မူလအတိုင်းပြန်ထားချင်ရင် အလွတ်ထားခဲ့ပါ)");

      if (bgInput !== null) {
        const trimmed = bgInput.trim();
        if (trimmed === '') {
          messagesContainer.style.background = '#1e293b';
          messagesContainer.style.backgroundImage = 'none';
          localStorage.removeItem('chatsphere_chat_bg');
        } else if (trimmed.startsWith('http') || trimmed.startsWith('data:')) {
          messagesContainer.style.backgroundImage = `url('${trimmed}')`;
          localStorage.setItem('chatsphere_chat_bg', trimmed);
        } else {
          messagesContainer.style.background = trimmed;
          messagesContainer.style.backgroundImage = 'none';
          localStorage.setItem('chatsphere_chat_bg', trimmed);
        }
      }
    });

    document.addEventListener('click', (e) => {
      if (!chatDropdownMenu.contains(e.target) && e.target !== chatMenuBtn) {
        chatDropdownMenu.classList.add('hidden');
      }
    });

    // PRESENCE SYSTEM WITH 5-MIN GRACE PERIOD LOGIC
    function initGlobalPresence() {
      const globalPresenceRef = db.ref(`global_online_users/${myClientId}`);
      const connectedRef = db.ref('.info/connected');

      connectedRef.on('value', (snap) => {
        if (snap.val() === true) {
          globalPresenceRef.set({
            id: myClientId,
            name: currentUsername,
            online: true,
            lastSeen: firebase.database.ServerValue.TIMESTAMP
          });

          // Disconnect ဖြစ်သွားချိန် (Page ပိတ်လိုက်ချိန်) တွင် online: false နှင့် lastSeen timestamp တင်ခဲ့မည်
          globalPresenceRef.onDisconnect().set({
            id: myClientId,
            name: currentUsername,
            online: false,
            lastSeen: firebase.database.ServerValue.TIMESTAMP
          });
        }
      });

      db.ref('global_online_users').on('value', (snapshot) => {
        const usersObj = snapshot.val() || {};
        latestUsersList = Object.values(usersObj);
        renderUsersUI();
      });

      // မိနစ်အလိုက် Status ပြောင်းလဲမှုကို 30 စက္ကန့်တိုင်း အလိုအလျောက် Update လုပ်ရန်
      setInterval(() => {
        renderUsersUI();
      }, 30000);
    }

    // ၅ မိနစ် Grace Period အတွက် ပြင်ဆင်ထားသော UI Render Function
    function renderUsersUI() {
      usersContainer.innerHTML = '';
      let visibleCount = 0;
      const GRACE_PERIOD_MS = 5 * 60 * 1000; // 5 mins in milliseconds
      const now = Date.now();

      latestUsersList.forEach(user => {
        if (user.id === myClientId) return; 

        const cleanName = (user.name || '').trim();
        if (!cleanName || cleanName.length <= 1 || cleanName === "Guest") return;

        // Grace Period တွက်ချက်ခြင်း Logic
        const isActuallyOnline = user.online === true;
        const timeDiff = now - (user.lastSeen || 0);
        const isWithinGracePeriod = !isActuallyOnline && (timeDiff <= GRACE_PERIOD_MS);

        // ထွက်သွားပြီး ၅ မိနစ်ထက်ကျော်သွားပါက မပြတော့ပါ
        if (!isActuallyOnline && !isWithinGracePeriod) return;

        visibleCount++;

        const displayName = nicknames[user.id] || cleanName;

        const userEl = document.createElement('div');
        userEl.className = `user-item ${selectedTargetUser && selectedTargetUser.id === user.id ? 'active' : ''}`;
        
        userEl.innerHTML = `
          <div class="user-info-group">
            <div class="status-dot ${isActuallyOnline ? '' : 'offline'}"></div>
            <span class="user-name">${escapeHTML(displayName)}</span>
          </div>
        `;
        
        userEl.addEventListener('click', () => {
          selectUserToChat(user);
        });

        usersContainer.appendChild(userEl);
      });

      userCountEl.textContent = visibleCount;
      
      // လက်ရှိ ရွေးထားသော စာပို့နေသူ၏ Header Status ကိုလည်း Update လုပ်မည်
      if (selectedTargetUser) {
        updateHeaderOnlineStatus();
      }
    }

    function updateHeaderOnlineStatus() {
      if (!selectedTargetUser) return;

      const liveUser = latestUsersList.find(u => u.id === selectedTargetUser.id);
      const now = Date.now();
      const GRACE_PERIOD_MS = 5 * 60 * 1000;

      if (liveUser && liveUser.online) {
        onlineStatusBadge.textContent = "● online";
        onlineStatusBadge.className = "online-badge";
      } else if (liveUser && liveUser.lastSeen) {
        const diffMs = now - liveUser.lastSeen;
        if (diffMs <= GRACE_PERIOD_MS) {
          const minsAgo = Math.max(1, Math.floor(diffMs / (1000 * 60)));
          onlineStatusBadge.textContent = `● Active ${minsAgo} min ago`;
          onlineStatusBadge.className = "online-badge offline";
        } else {
          onlineStatusBadge.textContent = "● offline";
          onlineStatusBadge.className = "online-badge offline";
        }
      } else {
        onlineStatusBadge.textContent = "● offline";
        onlineStatusBadge.className = "online-badge offline";
      }
    }

    function selectUserToChat(targetUser) {
      selectedTargetUser = targetUser;
      const displayName = nicknames[targetUser.id] || targetUser.name;
      targetUsernameEl.textContent = `💬 ${displayName} နှင့် စာပို့နေပါသည်`;
      
      updateHeaderOnlineStatus();

      activeChatRoomId = [myClientId, targetUser.id].sort().join('_direct_');

      noChatMsg.classList.add('hidden');
      inputWrapper.classList.remove('hidden');
      chatArea.classList.add('active-mobile');

      document.querySelectorAll('.user-item').forEach(el => el.classList.remove('active'));
      listenDirectMessages();
    }

    function listenDirectMessages() {
      messagesContainer.innerHTML = '';
      if (!activeChatRoomId) return;

      db.ref(`direct_messages/${activeChatRoomId}`).off();
      db.ref(`direct_messages/${activeChatRoomId}`).on('value', (snapshot) => {
        messagesContainer.innerHTML = '';
        const data = snapshot.val();
        if (data) {
          Object.keys(data).forEach(key => {
            const msg = data[key];
            
            if (msg.senderId !== myClientId && !msg.isRead) {
              db.ref(`direct_messages/${activeChatRoomId}/${key}`).update({ isRead: true });
            }

            renderMessage(key, msg);
          });
        }
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
      });
    }

    // Read/Sent Status Logic
    function renderMessage(key, msg) {
      const isMine = msg.senderId === myClientId;
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${isMine ? 'mine' : ''}`;

      const timeStr = new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      let statusHTML = '';
      if (isMine) {
        if (msg.isRead) {
          statusHTML = `<span class="read-status read" title="Read">✓✓</span>`;
        } else {
          statusHTML = `<span class="read-status sent" title="Sent">✓</span>`;
        }
      }

      let replyHTML = '';
      if (msg.replyTo) {
        replyHTML = `
          <div class="reply-quote">
            <strong>${escapeHTML(msg.replyTo.senderName)}</strong>
            ${escapeHTML(msg.replyTo.text)}
          </div>
        `;
      }

      // Process Reactions
      let reactionsHTML = '';
      if (msg.reactions) {
        const counts = {};
        let myReaction = null;

        Object.entries(msg.reactions).forEach(([uId, emoji]) => {
          counts[emoji] = (counts[emoji] || 0) + 1;
          if (uId === myClientId) myReaction = emoji;
        });

        const badges = Object.entries(counts).map(([emoji, count]) => {
          const isMyBadge = myReaction === emoji;
          return `<span class="reaction-badge ${isMyBadge ? 'my-reaction' : ''}">${emoji} ${count > 1 ? count : ''}</span>`;
        }).join('');

        reactionsHTML = `<div class="reactions-badge-container">${badges}</div>`;
      }

      msgDiv.innerHTML = `
        <div class="msg-meta">
          <strong>${isMine ? 'You' : escapeHTML(msg.senderName)}</strong>
          <span class="msg-time">
            ${timeStr} ${msg.isEdited ? '(edited)' : ''} ${statusHTML}
          </span>
        </div>
        ${replyHTML}
        <div class="msg-text" dir="ltr">${escapeHTML(msg.text)}</div>
        ${reactionsHTML}
      `;

      let pressTimer;

      const startPress = (e) => {
        pressTimer = setTimeout(() => {
          showContextMenu(e, key, msg, isMine);
        }, 500);
      };

      const cancelPress = () => {
        clearTimeout(pressTimer);
      };

      msgDiv.addEventListener('touchstart', startPress, { passive: true });
      msgDiv.addEventListener('touchend', cancelPress);
      msgDiv.addEventListener('touchmove', cancelPress);
      
      msgDiv.addEventListener('mousedown', (e) => {
        if (e.button === 0) startPress(e);
      });
      msgDiv.addEventListener('mouseup', cancelPress);
      msgDiv.addEventListener('mouseleave', cancelPress);

      msgDiv.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        showContextMenu(e, key, msg, isMine);
      });

      messagesContainer.appendChild(msgDiv);
    }

    // SHOW CONTEXT MENU (DELETE, REPLY, EDIT, REACT)
    function showContextMenu(e, key, msg, isMine) {
      selectedMsgKey = key;
      selectedMsgData = msg;

      const touch = e.touches ? e.touches[0] : e;
      let x = touch.clientX;
      let y = touch.clientY;

      if (x + 160 > window.innerWidth) x = window.innerWidth - 170;
      if (y + 180 > window.innerHeight) y = window.innerHeight - 190;

      if (isMine) {
        ctxEditBtn.classList.remove('hidden');
      } else {
        ctxEditBtn.classList.add('hidden');
      }

      contextMenu.style.top = `${y}px`;
      contextMenu.style.left = `${x}px`;
      contextMenu.classList.remove('hidden');
    }

    // HANDLE REACTION PICKER CLICK
    reactionPicker.addEventListener('click', (e) => {
      const emoji = e.target.getAttribute('data-emoji');
      if (!emoji || !selectedMsgKey || !activeChatRoomId) return;

      const userReactionRef = db.ref(`direct_messages/${activeChatRoomId}/${selectedMsgKey}/reactions/${myClientId}`);
      
      userReactionRef.get().then((snapshot) => {
        if (snapshot.exists() && snapshot.val() === emoji) {
          userReactionRef.remove();
        } else {
          userReactionRef.set(emoji);
        }
      });

      contextMenu.classList.add('hidden');
    });

    document.addEventListener('click', (e) => {
      if (!contextMenu.contains(e.target)) {
        contextMenu.classList.add('hidden');
      }
    });

    // CONTEXT ACTIONS
    ctxReplyBtn.addEventListener('click', () => {
      contextMenu.classList.add('hidden');
      activeReplyData = {
        senderName: selectedMsgData.senderId === myClientId ? 'You' : selectedMsgData.senderName,
        text: selectedMsgData.text
      };
      
      replyPreviewText.textContent = `Replying to ${activeReplyData.senderName}: "${activeReplyData.text}"`;
      replyPreviewBar.classList.remove('hidden');
      messageInput.focus();
    });

    cancelReplyBtn.addEventListener('click', () => {
      activeReplyData = null;
      replyPreviewBar.classList.add('hidden');
    });

    ctxEditBtn.addEventListener('click', () => {
      contextMenu.classList.add('hidden');
      const newText = prompt("စာတိုကို ပြင်ဆင်ပါ:", selectedMsgData.text);
      if (newText !== null && newText.trim() !== "" && newText !== selectedMsgData.text) {
        db.ref(`direct_messages/${activeChatRoomId}/${selectedMsgKey}`).update({
          text: newText.trim(),
          isEdited: true
        });
      }
    });

    ctxDeleteBtn.addEventListener('click', () => {
      contextMenu.classList.add('hidden');
      if (confirm("ဤ စာကြောင်းကို Permanent ဖျက်ပစ်ရန် သေချာပါသလား?")) {
        db.ref(`direct_messages/${activeChatRoomId}/${selectedMsgKey}`).remove();
      }
    });

    // SEND DIRECT MESSAGE
    chatForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = messageInput.value.trim();
      if (!text || !activeChatRoomId) return;

      const messageData = {
        senderId: myClientId,
        senderName: currentUsername,
        text: text,
        timestamp: firebase.database.ServerValue.TIMESTAMP,
        isRead: false
      };

      if (activeReplyData) {
        messageData.replyTo = activeReplyData;
      }

      db.ref(`direct_messages/${activeChatRoomId}`).push(messageData);

      messageInput.value = '';
      activeReplyData = null;
      replyPreviewBar.classList.add('hidden');
    });

    // PROFILE MODAL LOGIC
    openProfileBtn.addEventListener('click', () => {
      modalUsernameInput.value = currentUsername;
      profileModal.classList.remove('hidden');
    });

    closeModalBtn.addEventListener('click', () => {
      profileModal.classList.add('hidden');
    });

    saveProfileBtn.addEventListener('click', () => {
      const newUsername = modalUsernameInput.value.trim();
      if (!newUsername) return;

      localStorage.setItem('chatsphere_username', newUsername);
      currentUsername = newUsername;
      displayMyUsername.textContent = currentUsername;

      db.ref(`global_online_users/${myClientId}`).update({ name: currentUsername });
      profileModal.classList.add('hidden');
    });

    function escapeHTML(str) {
      return (str || '').replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }
  </script>
</body>
</html>
