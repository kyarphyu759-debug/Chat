<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatSphere - Mobile Ready Direct Messenger</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .hidden { display: none !important; }

    #chat-app { display: flex; width: 100vw; height: 100vh; max-width: 1100px; background: #1e293b; overflow: hidden; position: relative; }
    
    /* Sidebar Layout */
    .sidebar { width: 320px; background: #0f172a; padding: 1rem; border-right: 1px solid #334155; display: flex; flex-direction: column; transition: 0.3s; z-index: 10; }
    
    .my-profile-info { background: #1e293b; padding: 0.8rem; border-radius: 8px; margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: center; }
    .my-profile-info h4 { color: #94a3b8; font-size: 0.7rem; text-transform: uppercase; }
    .my-profile-info p { color: #38bdf8; font-weight: bold; font-size: 1rem; }

    .users-list { flex: 1; overflow-y: auto; }
    .users-list h3 { font-size: 0.8rem; color: #94a3b8; margin-bottom: 0.75rem; }
    
    .user-item { display: flex; align-items: center; gap: 10px; margin-bottom: 0.5rem; font-size: 0.9rem; background: #1e293b; padding: 10px; border-radius: 8px; cursor: pointer; transition: 0.2s; }
    .user-item:hover, .user-item.active { background: #2563eb; color: white; }
    .status-dot { width: 8px; height: 8px; background: #22c55e; border-radius: 50%; box-shadow: 0 0 8px #22c55e; flex-shrink: 0; }

    /* Chat Area Layout */
    .chat-area { flex: 1; display: flex; flex-direction: column; position: relative; background: #1e293b; height: 100%; }
    .chat-header { padding: 0.8rem 1rem; background: #0f172a; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
    .target-user-bar { display: flex; align-items: center; gap: 10px; }

    .messages-container { flex: 1; padding: 1rem; overflow-y: auto; display: flex; flex-direction: column; gap: 0.8rem; }
    .message { max-width: 80%; padding: 0.6rem 0.9rem; border-radius: 12px; background: #334155; align-self: flex-start; word-wrap: break-word; font-size: 0.95rem; }
    .message.mine { background: #2563eb; align-self: flex-end; }
    .msg-meta { font-size: 0.7rem; color: #cbd5e1; margin-bottom: 0.2rem; display: flex; justify-content: space-between; gap: 0.8rem; }
    .msg-time { opacity: 0.7; }

    .input-area { padding: 0.8rem; background: #0f172a; display: flex; gap: 8px; }
    input { flex: 1; padding: 0.7rem; border: 1px solid #334155; border-radius: 6px; background: #1e293b; color: #fff; font-size: 0.95rem; outline: none; }
    input:focus { border-color: #38bdf8; }
    button { padding: 0.7rem 1.2rem; background: #2563eb; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    
    .edit-profile-btn { background: #334155; color: #38bdf8; border: 1px solid #38bdf8; padding: 0.3rem 0.6rem; border-radius: 6px; font-size: 0.75rem; cursor: pointer; }
    .back-btn { background: #475569; padding: 0.4rem 0.8rem; font-size: 0.85rem; border-radius: 6px; display: none; }

    .no-chat-selected { display: flex; height: 100%; justify-content: center; align-items: center; color: #64748b; font-size: 0.95rem; text-align: center; padding: 1rem; }

    /* Modal */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.7); display: flex; justify-content: center; align-items: center; z-index: 1000; }
    .modal-card { background: #1e293b; padding: 1.5rem; border-radius: 12px; width: 90%; max-width: 380px; }
    .modal-card h3 { color: #38bdf8; margin-bottom: 1rem; }
    .modal-card label { display: block; font-size: 0.85rem; color: #94a3b8; margin-bottom: 0.3rem; }
    .modal-card input { width: 100%; margin-bottom: 1rem; }
    .modal-actions { display: flex; gap: 10px; margin-top: 0.5rem; }

    /* 📱 MOBILE RESPONSIVE MEDIA QUERIES (ဖုန်းအတွက် သီးသန့် ပြင်ဆင်ချက်) */
    @media (max-width: 768px) {
      #chat-app { height: 100dvh; border-radius: 0; }
      .sidebar { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
      .chat-area { width: 100%; height: 100%; position: absolute; top: 0; left: 0; display: none; }
      .chat-area.active-mobile { display: flex; z-index: 20; }
      .back-btn { display: inline-block; }
    }
  </style>
</head>
<body>

  <div id="chat-app">
    <!-- Sidebar (Online Users List) -->
    <div class="sidebar" id="sidebar">
      <div class="my-profile-info">
        <div>
          <h4>MY PROFILE</h4>
          <p id="display-my-username">Guest</p>
        </div>
        <button id="open-profile-btn" class="edit-profile-btn">⚙️ Edit</button>
      </div>
      
      <div class="users-list">
        <h3>GLOBAL ONLINE USERS (<span id="user-count">0</span>)</h3>
        <div id="users-container"></div>
      </div>
    </div>

    <!-- Chat Area -->
    <div class="chat-area" id="chat-area">
      <div class="chat-header">
        <div class="target-user-bar">
          <button id="back-to-users-btn" class="back-btn">⬅️ Users</button>
          <h4 id="target-username">စာပို့ချင်သူကို ရွေးပါ</h4>
        </div>
      </div>

      <div class="messages-container" id="messages-container">
        <div class="no-chat-selected" id="no-chat-msg">👈 ဘေးဘက် Online Users စာရင်းမှ စာပို့ချင်သူကို နှိပ်ပါ။</div>
      </div>

      <form class="input-area hidden" id="chat-form">
        <input type="text" id="message-input" placeholder="စာတို ရိုက်ထည့်ပါ..." autocomplete="off" />
        <button type="submit">Send</button>
      </form>
    </div>
  </div>

  <!-- Profile Modal -->
  <div id="profile-modal" class="modal-overlay hidden">
    <div class="modal-card">
      <h3>Username ပြောင်းရန်</h3>
      <label>User Name</label>
      <input type="text" id="modal-username-input" placeholder="Username အသစ်..." required />
      <div class="modal-actions">
        <button type="button" id="save-profile-btn" style="flex: 1;">Save</button>
        <button type="button" id="close-modal-btn" style="background:#475569;">Cancel</button>
      </div>
    </div>
  </div>

  <!-- FIREBASE SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "ဒီနေရာမှာ သင့် Firebase API Key အမှန်ကို အစားထိုးပါ", 
      authDomain: "chat-20ea2.firebaseapp.com",
      databaseURL: "https://chat-20ea2-default-rtdb.firebaseio.com",
      projectId: "chat-20ea2",
      storageBucket: "chat-20ea2.appspot.com",
      messagingSenderId: "237395870913",
      appId: "1:237395870913:web:ea718b60cef5a5354e4040",
      measurementId: "G-TR1DR12NSV"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    let myClientId = sessionStorage.getItem('chatsphere_client_id');
    if (!myClientId) {
      myClientId = 'usr_' + Math.random().toString(36).substr(2, 9);
      sessionStorage.setItem('chatsphere_client_id', myClientId);
    }

    let currentUsername = localStorage.getItem('chatsphere_username') || ('Guest_' + myClientId.substr(-4));
    let selectedTargetUser = null;
    let activeChatRoomId = null;

    // DOM Elements
    const sidebar = document.getElementById('sidebar');
    const chatArea = document.getElementById('chat-area');
    const backToUsersBtn = document.getElementById('back-to-users-btn');

    const displayMyUsername = document.getElementById('display-my-username');
    const usersContainer = document.getElementById('users-container');
    const userCountEl = document.getElementById('user-count');
    const targetUsernameEl = document.getElementById('target-username');
    const messagesContainer = document.getElementById('messages-container');
    const noChatMsg = document.getElementById('no-chat-msg');
    const chatForm = document.getElementById('chat-form');
    const messageInput = document.getElementById('message-input');

    const profileModal = document.getElementById('profile-modal');
    const openProfileBtn = document.getElementById('open-profile-btn');
    const closeModalBtn = document.getElementById('close-modal-btn');
    const saveProfileBtn = document.getElementById('save-profile-btn');
    const modalUsernameInput = document.getElementById('modal-username-input');

    // STARTUP
    window.addEventListener('DOMContentLoaded', async () => {
      try {
        if (!auth.currentUser) await auth.signInAnonymously();
        displayMyUsername.textContent = currentUsername;
        initGlobalPresence();
      } catch (e) { console.error(e); }
    });

    // PRESENCE SYSTEM
    function initGlobalPresence() {
      const globalPresenceRef = db.ref(`global_online_users/${myClientId}`);

      db.ref('.info/connected').on('value', (snap) => {
        if (snap.val() === true) {
          globalPresenceRef.onDisconnect().remove();
          globalPresenceRef.set({ id: myClientId, name: currentUsername, online: true });
        }
      });

      db.ref('global_online_users').on('value', (snapshot) => {
        usersContainer.innerHTML = '';
        const usersObj = snapshot.val() || {};
        const usersList = Object.values(usersObj);
        userCountEl.textContent = usersList.length;

        usersList.forEach(user => {
          if (user.id === myClientId) return;

          const userEl = document.createElement('div');
          userEl.className = `user-item ${selectedTargetUser && selectedTargetUser.id === user.id ? 'active' : ''}`;
          userEl.innerHTML = `<div class="status-dot"></div><span>${escapeHTML(user.name)}</span>`;
          
          userEl.addEventListener('click', () => {
            selectUserToChat(user);
          });

          usersContainer.appendChild(userEl);
        });
      });
    }

    // SELECT USER & MOBILE VIEW SWITCH
    function selectUserToChat(targetUser) {
      selectedTargetUser = targetUser;
      targetUsernameEl.textContent = `💬 ${targetUser.name}`;
      activeChatRoomId = [myClientId, targetUser.id].sort().join('_direct_');

      noChatMsg.classList.add('hidden');
      chatForm.classList.remove('hidden');

      // ဖုန်း screen မှာ Chat area သို့ အလိုအလျောက် ပို့ပေးမည်
      chatArea.classList.add('active-mobile');

      listenDirectMessages();
    }

    // Back to Users list (Mobile only)
    backToUsersBtn.addEventListener('click', () => {
      chatArea.classList.remove('active-mobile');
    });

    // LISTEN MESSAGES
    function listenDirectMessages() {
      messagesContainer.innerHTML = '';
      if (!activeChatRoomId) return;

      db.ref(`direct_messages/${activeChatRoomId}`).off();
      db.ref(`direct_messages/${activeChatRoomId}`).on('child_added', (snapshot) => {
        renderMessage(snapshot.val());
      });
    }

    function renderMessage(msg) {
      const isMine = msg.senderId === myClientId;
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${isMine ? 'mine' : ''}`;

      const timeStr = new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      msgDiv.innerHTML = `
        <div class="msg-meta">
          <strong>${isMine ? 'You' : escapeHTML(msg.senderName)}</strong>
          <span class="msg-time">${timeStr}</span>
        </div>
        <div class="msg-text">${escapeHTML(msg.text)}</div>
      `;

      messagesContainer.appendChild(msgDiv);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    // SEND MESSAGE
    chatForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = messageInput.value.trim();
      if (!text || !activeChatRoomId) return;

      db.ref(`direct_messages/${activeChatRoomId}`).push({
        senderId: myClientId,
        senderName: currentUsername,
        text: text,
        timestamp: firebase.database.ServerValue.TIMESTAMP
      });
      messageInput.value = '';
    });

    // PROFILE MODAL
    openProfileBtn.addEventListener('click', () => {
      modalUsernameInput.value = currentUsername;
      profileModal.classList.remove('hidden');
    });

    closeModalBtn.addEventListener('click', () => profileModal.classList.add('hidden'));

    saveProfileBtn.addEventListener('click', () => {
      const newUsername = modalUsernameInput.value.trim();
      if (!newUsername) return;

      localStorage.setItem('chatsphere_username', newUsername);
      currentUsername = newUsername;
      displayMyUsername.textContent = currentUsername;

      db.ref(`global_online_users/${myClientId}`).update({ name: currentUsername });
      profileModal.classList.add('hidden');
    });

    function escapeHTML(str) {
      return (str || '').replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
    }
  </script>
</body>
</html>
