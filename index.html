<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatSphere - Real-time Web Messenger</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .hidden {
      display: none !important;
    }

    /* Main Chat App Layout */
    #chat-app {
      display: flex;
      width: 90vw;
      height: 85vh;
      max-width: 1100px;
      background: #1e293b;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    /* Sidebar */
    .sidebar {
      width: 280px;
      background: #0f172a;
      padding: 1.5rem;
      border-right: 1px solid #334155;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .room-info {
      background: #1e293b;
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 1.5rem;
    }

    .room-info h4 {
      color: #94a3b8;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .room-info p {
      color: #38bdf8;
      font-weight: bold;
      font-size: 1.1rem;
      margin-top: 0.25rem;
      word-break: break-all;
    }

    .users-list h3 {
      font-size: 0.9rem;
      color: #94a3b8;
      margin-bottom: 0.75rem;
    }

    .user-item {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 0.5rem;
      font-size: 0.95rem;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: #22c55e;
      border-radius: 50%;
    }

    /* Chat Area */
    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .chat-header {
      padding: 1rem 1.5rem;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .user-profile-bar {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .edit-profile-btn {
      background: #334155;
      color: #38bdf8;
      border: 1px solid #38bdf8;
      padding: 0.3rem 0.8rem;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: 0.2s;
    }

    .edit-profile-btn:hover {
      background: #38bdf8;
      color: #0f172a;
    }

    .messages-container {
      flex: 1;
      padding: 1.5rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .message {
      max-width: 65%;
      padding: 0.75rem 1rem;
      border-radius: 12px;
      background: #334155;
      align-self: flex-start;
      word-wrap: break-word;
    }

    .message.mine {
      background: #2563eb;
      align-self: flex-end;
    }

    .msg-meta {
      font-size: 0.75rem;
      color: #cbd5e1;
      margin-bottom: 0.25rem;
      display: flex;
      justify-content: space-between;
      gap: 1rem;
    }

    .msg-time {
      opacity: 0.7;
    }

    .typing-indicator {
      font-size: 0.85rem;
      color: #94a3b8;
      font-style: italic;
      height: 20px;
      padding: 0 1.5rem;
    }

    /* Input Area */
    .input-area {
      padding: 1rem 1.5rem;
      background: #0f172a;
      display: flex;
      gap: 10px;
    }

    input {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #334155;
      border-radius: 6px;
      background: #0f172a;
      color: #fff;
      font-size: 1rem;
      outline: none;
    }

    input:focus {
      border-color: #38bdf8;
    }

    button {
      padding: 0.75rem 1.5rem;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: #1d4ed8;
    }

    /* Profile Edit Modal Pop-up */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-card {
      background: #1e293b;
      padding: 2rem;
      border-radius: 12px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .modal-card h3 {
      color: #38bdf8;
      margin-bottom: 1rem;
    }

    .modal-card label {
      display: block;
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 0.3rem;
      text-align: left;
    }

    .modal-card input {
      margin-bottom: 1rem;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 0.5rem;
    }

    .cancel-btn {
      background: #475569;
    }

    .cancel-btn:hover {
      background: #334155;
    }
  </style>
</head>
<body>

  <!-- MAIN CHAT APP DASHBOARD -->
  <div id="chat-app">
    <!-- Sidebar -->
    <div class="sidebar">
      <div>
        <div class="room-info">
          <h4>Current Room</h4>
          <p id="display-room-id">#gaming-123</p>
        </div>
        <div class="users-list">
          <h3>ONLINE USERS</h3>
          <div id="users-container"></div>
        </div>
      </div>
    </div>

    <!-- Main Chat Area -->
    <div class="chat-area">
      <div class="chat-header">
        <div class="user-profile-bar">
          <h3 id="display-username">Guest</h3>
          <button id="open-profile-btn" class="edit-profile-btn">⚙️ Edit Profile</button>
        </div>
        <span style="font-size:0.8rem; color: #22c55e;">● Live Connected</span>
      </div>

      <!-- Messages Stream -->
      <div class="messages-container" id="messages-container"></div>

      <!-- Typing Indicator Bar -->
      <div class="typing-indicator" id="typing-indicator"></div>

      <!-- Input Message Box -->
      <form class="input-area" id="chat-form">
        <input type="text" id="message-input" placeholder="စာတို ရိုက်ထည့်ပါ..." autocomplete="off" />
        <button type="submit">Send</button>
      </form>
    </div>
  </div>

  <!-- PROFILE EDIT MODAL POPUP -->
  <div id="profile-modal" class="modal-overlay hidden">
    <div class="modal-card">
      <h3>အကောင့် အချက်အလက် ပြောင်းရန်</h3>
      
      <label>User Name</label>
      <input type="text" id="modal-username-input" placeholder="Username အသစ်..." required />

      <label>Password</label>
      <input type="password" id="modal-password-input" placeholder="Password အသစ်..." required />

      <label>Room ID</label>
      <input type="text" id="modal-room-input" placeholder="Room ID (eg. gaming-123)..." required />

<div class="modal-actions">
        <button type="button" id="save-profile-btn" style="flex: 1;">Save Updates</button>
        <button type="button" id="close-modal-btn" class="cancel-btn">Cancel</button>
      </div>
    </div>
  </div>

  <!-- FIREBASE SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <script>
    // 1. FIREBASE CONFIGURATION
    const firebaseConfig = {
      apiKey: "AIzaSyDbrOZ_ro3YrBxpnHb3icXUxzuLTqtYCZo",
      authDomain: "chat-20ea2.firebaseapp.com",
      databaseURL: "https://chat-20ea2-default-rtdb.firebaseio.com",
      projectId: "chat-20ea2",
      storageBucket: "chat-20ea2.appspot.com",
      messagingSenderId: "237395870913",
      appId: "1:237395870913:web:ea718b60cef5a5354e4040",
      measurementId: "G-TR1DR12NSV"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    // Session Persistence Local
    auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);

    // App State Variables (Default values: Guest & gaming-123)
    let currentUser = null;
    let currentRoomId = localStorage.getItem('chatsphere_room') || 'gaming-123';
    let currentUsername = localStorage.getItem('chatsphere_username') || 'Guest';
    let currentPassword = localStorage.getItem('chatsphere_password') || '';
    let typingTimeout = null;

    // DOM Elements
    const displayRoomId = document.getElementById('display-room-id');
    const displayUsername = document.getElementById('display-username');
    const usersContainer = document.getElementById('users-container');
    const messagesContainer = document.getElementById('messages-container');
    const chatForm = document.getElementById('chat-form');
    const messageInput = document.getElementById('message-input');
    const typingIndicator = document.getElementById('typing-indicator');

    // Modal Elements
    const profileModal = document.getElementById('profile-modal');
    const openProfileBtn = document.getElementById('open-profile-btn');
    const closeModalBtn = document.getElementById('close-modal-btn');
    const saveProfileBtn = document.getElementById('save-profile-btn');
    const modalUsernameInput = document.getElementById('modal-username-input');
    const modalPasswordInput = document.getElementById('modal-password-input');
    const modalRoomInput = document.getElementById('modal-room-input');

    // 2. AUTO INITIALIZATION (Default ဝင်ရောက်ခြင်း)
    window.addEventListener('DOMContentLoaded', async () => {
      try {
        if (!auth.currentUser) {
          await auth.signInAnonymously();
        }
        
        currentUser = {
          uid: auth.currentUser.uid,
          name: currentUsername
        };

        // UI Update
        displayRoomId.textContent = `#${currentRoomId}`;
        displayUsername.textContent = currentUser.name;

        // Initialize Realtime System
        initRoomSystem();

      } catch (error) {
        console.error("Auto Login Error:", error);
      }
    });

    // 3. PROFILE MODAL CONTROLS
    openProfileBtn.addEventListener('click', () => {
      modalUsernameInput.value = currentUsername;
      modalPasswordInput.value = currentPassword;
      modalRoomInput.value = currentRoomId;
      profileModal.classList.remove('hidden');
    });

    closeModalBtn.addEventListener('click', () => {
      profileModal.classList.add('hidden');
    });

    // Save Updates (Username & Password ပြောင်းလဲခြင်း)
    saveProfileBtn.addEventListener('click', async () => {
      const newUsername = modalUsernameInput.value.trim();
      const newPassword = modalPasswordInput.value.trim();
      const newRoom = modalRoomInput.value.trim().toLowerCase().replace(/\s+/g, '-');

      if (!newUsername || !newRoom) {
        alert("Username နှင့် Room ID ဖြည့်စွက်ပေးပါ။");
        return;
      }

      try {
        // Old Room presence ဖျက်ခြင်း
        if (currentRoomId && currentUser && currentUser.uid) {
          await db.ref(`rooms/${currentRoomId}/users/${currentUser.uid}`).remove().catch(e => console.log(e));
        }

        // LocalStorage Updates
        localStorage.setItem('chatsphere_username', newUsername);
        localStorage.setItem('chatsphere_password', newPassword);
        localStorage.setItem('chatsphere_room', newRoom);

        // State Updates
        currentUsername = newUsername;
        currentPassword = newPassword;
        currentRoomId = newRoom;
        
        if (!currentUser) {
          currentUser = { uid: auth.currentUser ? auth.currentUser.uid : 'guest-' + Date.now(), name: newUsername };
        } else {
          currentUser.name = newUsername;
        }

        // UI Update
        displayUsername.textContent = currentUsername;
        displayRoomId.textContent = `#${currentRoomId}`;

        // Re-init Realtime System
        initRoomSystem();

        profileModal.classList.add('hidden');
        alert("အကောင့် အချက်အလက်များ အောင်မြင်စွာ ပြောင်းလဲလိုက်ပါပြီ!");
      } catch (err) {
        console.error("Save Profile Error:", err);
        // Error ဖြစ်ခဲ့ရင်တောင် UI အပိုင်းကို ပြောင်းပေးမည်
        profileModal.classList.add('hidden');
      }
    });
    // 4. REAL-TIME DATA SYNCING LOGIC
    function initRoomSystem() {
      const roomRef = db.ref(`rooms/${currentRoomId}`);

      // Online Status
      const userPresenceRef = roomRef.child(`users/${currentUser.uid}`);
      userPresenceRef.set({ name: currentUser.name, online: true });
      userPresenceRef.onDisconnect().remove();

      // Active Users Monitoring
      roomRef.child('users').off();
      roomRef.child('users').on('value', (snapshot) => {
        usersContainer.innerHTML = '';
        const users = snapshot.val() || {};
        Object.values(users).forEach(user => {
          const userEl = document.createElement('div');
          userEl.className = 'user-item';
          userEl.innerHTML = `<div class="status-dot"></div><span>${user.name}</span>`;
          usersContainer.appendChild(userEl);
        });
      });

      // Realtime Messages Syncing
      messagesContainer.innerHTML = '';
      roomRef.child('messages').off();
      roomRef.child('messages').on('child_added', (snapshot) => {
        const msg = snapshot.val();
        renderMessage(msg);
      });

      // Typing Indicator
      roomRef.child('typing').off();
      roomRef.child('typing').on('value', (snapshot) => {
        const typers = snapshot.val() || {};
        const activeTypers = Object.keys(typers)
          .filter(uid => uid !== currentUser.uid && typers[uid] === true);

        if (activeTypers.length > 0) {
          typingIndicator.textContent = `တစ်ယောက်ယောက် စာရိုက်နေပါသည်။...`;
        } else {
          typingIndicator.textContent = '';
        }
      });
    }

    // 5. MESSAGE RENDERING
    function renderMessage(msg) {
      const isMine = msg.uid === currentUser.uid;
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${isMine ? 'mine' : ''}`;

      const timeStr = new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      msgDiv.innerHTML = `
        <div class="msg-meta">
          <strong>${isMine ? 'You' : msg.sender}</strong>
          <span class="msg-time">${timeStr}</span>
        </div>
        <div class="msg-text">${escapeHTML(msg.text)}</div>
      `;

      messagesContainer.appendChild(msgDiv);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    // 6. SEND MESSAGE & TYPING
    chatForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = messageInput.value.trim();
      if (!text) return;

      const messageData = {
        uid: currentUser.uid,
        sender: currentUser.name,
        text: text,
        timestamp: firebase.database.ServerValue.TIMESTAMP
      };

      db.ref(`rooms/${currentRoomId}/messages`).push(messageData);
      db.ref(`rooms/${currentRoomId}/typing/${currentUser.uid}`).remove();
      messageInput.value = '';
    });

    messageInput.addEventListener('input', () => {
      const typingRef = db.ref(`rooms/${currentRoomId}/typing/${currentUser.uid}`);
      typingRef.set(true);

      clearTimeout(typingTimeout);
      typingTimeout = setTimeout(() => {
        typingRef.remove();
      }, 2000);
    });

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }
  </script>
</body>
</html>
