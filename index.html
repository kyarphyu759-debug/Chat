<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatSphere - Real-time Direct Messenger</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; }
    .hidden { display: none !important; }

    #chat-app { display: flex; width: 90vw; height: 85vh; max-width: 1100px; background: #1e293b; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .sidebar { width: 300px; background: #0f172a; padding: 1.5rem; border-right: 1px solid #334155; display: flex; flex-direction: column; }
    
    .my-profile-info { background: #1e293b; padding: 1rem; border-radius: 8px; margin-bottom: 1.5rem; display: flex; justify-content: space-between; align-items: center; }
    .my-profile-info h4 { color: #94a3b8; font-size: 0.75rem; text-transform: uppercase; }
    .my-profile-info p { color: #38bdf8; font-weight: bold; font-size: 1.1rem; }

    .users-list { flex: 1; overflow-y: auto; }
    .users-list h3 { font-size: 0.85rem; color: #94a3b8; margin-bottom: 0.75rem; }
    
    .user-item { display: flex; align-items: center; gap: 10px; margin-bottom: 0.5rem; font-size: 0.95rem; background: #1e293b; padding: 10px; border-radius: 8px; cursor: pointer; transition: 0.2s; border: 1px solid transparent; }
    .user-item:hover { background: #334155; }
    .user-item.active { background: #2563eb; border-color: #38bdf8; }
    .status-dot { width: 10px; height: 10px; background: #22c55e; border-radius: 50%; box-shadow: 0 0 8px #22c55e; flex-shrink: 0; }

    .chat-area { flex: 1; display: flex; flex-direction: column; position: relative; }
    .chat-header { padding: 1rem 1.5rem; background: #1e293b; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
    .target-user-bar { display: flex; align-items: center; gap: 10px; }

    .messages-container { flex: 1; padding: 1.5rem; overflow-y: auto; display: flex; flex-direction: column; gap: 1rem; }
    .message { max-width: 65%; padding: 0.75rem 1rem; border-radius: 12px; background: #334155; align-self: flex-start; word-wrap: break-word; }
    .message.mine { background: #2563eb; align-self: flex-end; }
    .msg-meta { font-size: 0.75rem; color: #cbd5e1; margin-bottom: 0.25rem; display: flex; justify-content: space-between; gap: 1rem; }
    .msg-time { opacity: 0.7; }

    .typing-indicator { font-size: 0.85rem; color: #94a3b8; font-style: italic; height: 20px; padding: 0 1.5rem; }
    .input-area { padding: 1rem 1.5rem; background: #0f172a; display: flex; gap: 10px; }
    input { width: 100%; padding: 0.75rem; border: 1px solid #334155; border-radius: 6px; background: #0f172a; color: #fff; font-size: 1rem; outline: none; }
    input:focus { border-color: #38bdf8; }
    button { padding: 0.75rem 1.5rem; background: #2563eb; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #1d4ed8; }
    .edit-profile-btn { background: #334155; color: #38bdf8; border: 1px solid #38bdf8; padding: 0.3rem 0.6rem; border-radius: 6px; font-size: 0.75rem; cursor: pointer; }

    .no-chat-selected { display: flex; height: 100%; justify-content: center; align-items: center; color: #64748b; font-size: 1.1rem; }

    /* Modal */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.7); display: flex; justify-content: center; align-items: center; z-index: 1000; }
    .modal-card { background: #1e293b; padding: 2rem; border-radius: 12px; width: 100%; max-width: 400px; }
    .modal-card h3 { color: #38bdf8; margin-bottom: 1rem; }
    .modal-card label { display: block; font-size: 0.85rem; color: #94a3b8; margin-bottom: 0.3rem; }
    .modal-card input { margin-bottom: 1rem; }
    .modal-actions { display: flex; gap: 10px; margin-top: 0.5rem; }
    .cancel-btn { background: #475569; }
  </style>
</head>
<body>

  <div id="chat-app">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="my-profile-info">
        <div>
          <h4>MY PROFILE</h4>
          <p id="display-my-username">Guest</p>
        </div>
        <button id="open-profile-btn" class="edit-profile-btn">⚙️ Edit</button>
      </div>
      
      <div class="users-list">
        <h3>GLOBAL ONLINE USERS (<span id="user-count">0</span>)</h3>
        <div id="users-container"></div>
      </div>
    </div>

    <!-- Chat Area -->
    <div class="chat-area">
      <div class="chat-header">
        <div class="target-user-bar">
          <h3 id="target-username">ကျေးဇူးပြု၍ စာပို့ချင်သည့် User ကို ရွေးချယ်ပါ</h3>
        </div>
        <span style="font-size:0.8rem; color: #22c55e;">● Live</span>
      </div>

      <div class="messages-container" id="messages-container">
        <div class="no-chat-selected" id="no-chat-msg">👈 ဘေးဘက် Online Users စာရင်းမှ ပို့ချင်သောသူကို နှိပ်ပါ။</div>
      </div>
      
      <div class="typing-indicator" id="typing-indicator"></div>

      <form class="input-area hidden" id="chat-form">
        <input type="text" id="message-input" placeholder="စာတို ရိုက်ထည့်ပါ..." autocomplete="off" />
        <button type="submit">Send</button>
      </form>
    </div>
  </div>

  <!-- Profile Modal -->
  <div id="profile-modal" class="modal-overlay hidden">
    <div class="modal-card">
      <h3>User Name ပြောင်းလဲရန်</h3>
      <label>User Name</label>
      <input type="text" id="modal-username-input" placeholder="Username အသစ်..." required />
      <div class="modal-actions">
        <button type="button" id="save-profile-btn" style="flex: 1;">Save Changes</button>
        <button type="button" id="close-modal-btn" class="cancel-btn">Cancel</button>
      </div>
    </div>
  </div>

  <!-- FIREBASE SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "ဒီနေရာမှာ သင့် Firebase API Key အမှန်ကို အစားထိုးပါ", 
      authDomain: "chat-20ea2.firebaseapp.com",
      databaseURL: "https://chat-20ea2-default-rtdb.firebaseio.com",
      projectId: "chat-20ea2",
      storageBucket: "chat-20ea2.appspot.com",
      messagingSenderId: "237395870913",
      appId: "1:237395870913:web:ea718b60cef5a5354e4040",
      measurementId: "G-TR1DR12NSV"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    // Session Unique Client ID Generator
    let myClientId = sessionStorage.getItem('chatsphere_client_id');
    if (!myClientId) {
      myClientId = 'usr_' + Math.random().toString(36).substr(2, 9);
      sessionStorage.setItem('chatsphere_client_id', myClientId);
    }

    let currentUsername = localStorage.getItem('chatsphere_username') || ('Guest_' + myClientId.substr(-4));
    let selectedTargetUser = null; // { id, name }
    let activeChatRoomId = null;

    // DOM Elements
    const displayMyUsername = document.getElementById('display-my-username');
    const usersContainer = document.getElementById('users-container');
    const userCountEl = document.getElementById('user-count');
    const targetUsernameEl = document.getElementById('target-username');
    const messagesContainer = document.getElementById('messages-container');
    const noChatMsg = document.getElementById('no-chat-msg');
    const chatForm = document.getElementById('chat-form');
    const messageInput = document.getElementById('message-input');

    const profileModal = document.getElementById('profile-modal');
    const openProfileBtn = document.getElementById('open-profile-btn');
    const closeModalBtn = document.getElementById('close-modal-btn');
    const saveProfileBtn = document.getElementById('save-profile-btn');
    const modalUsernameInput = document.getElementById('modal-username-input');

    // STARTUP
    window.addEventListener('DOMContentLoaded', async () => {
      try {
        if (!auth.currentUser) {
          await auth.signInAnonymously();
        }
        displayMyUsername.textContent = currentUsername;
        initGlobalPresence();
      } catch (error) {
        console.error("Auth Error:", error);
      }
    });

    // GLOBAL ONLINE PRESENCE SYSTEM
    function initGlobalPresence() {
      const globalPresenceRef = db.ref(`global_online_users/${myClientId}`);

      globalPresenceRef.set({
        id: myClientId,
        name: currentUsername,
        online: true
      });
      globalPresenceRef.onDisconnect().remove();

      // Listen to ALL Online Users
      db.ref('global_online_users').on('value', (snapshot) => {
        usersContainer.innerHTML = '';
        const usersObj = snapshot.val() || {};
        const usersList = Object.values(usersObj);
        
        userCountEl.textContent = usersList.length;

        usersList.forEach(user => {
          if (user.id === myClientId) return; // မွေးထုတ်ထားသော မိမိကိုယ်တိုင်ကို List မှ ခေတ္တချန်ထားမည်

          const userEl = document.createElement('div');
          userEl.className = `user-item ${selectedTargetUser && selectedTargetUser.id === user.id ? 'active' : ''}`;
          userEl.innerHTML = `<div class="status-dot"></div><span>${escapeHTML(user.name)}</span>`;
          
          userEl.addEventListener('click', () => {
            selectUserToChat(user);
          });

          usersContainer.appendChild(userEl);
        });
      });
    }

    // SELECT USER TO CHAT
    function selectUserToChat(targetUser) {
      selectedTargetUser = targetUser;
      targetUsernameEl.textContent = `💬 ${targetUser.name} နှင့် စာပို့နေပါသည်`;
      
      // Generate Unique Direct Message Room ID (Sorting IDs ensures both users share the SAME room)
      activeChatRoomId = [myClientId, targetUser.id].sort().join('_direct_');

      // Enable UI
      noChatMsg.classList.add('hidden');
      chatForm.classList.remove('hidden');

      // Re-render user active list
      initGlobalPresence();

      // Listen to Direct Messages
      listenDirectMessages();
    }

    // LISTEN DIRECT MESSAGES
    function listenDirectMessages() {
      messagesContainer.innerHTML = '';
      if (!activeChatRoomId) return;

      db.ref(`direct_messages/${activeChatRoomId}`).off();
      db.ref(`direct_messages/${activeChatRoomId}`).on('child_added', (snapshot) => {
        renderMessage(snapshot.val());
      });
    }

    function renderMessage(msg) {
      const isMine = msg.senderId === myClientId;
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${isMine ? 'mine' : ''}`;

      const timeStr = new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      msgDiv.innerHTML = `
        <div class="msg-meta">
          <strong>${isMine ? 'You' : escapeHTML(msg.senderName)}</strong>
          <span class="msg-time">${timeStr}</span>
        </div>
        <div class="msg-text">${escapeHTML(msg.text)}</div>
      `;

      messagesContainer.appendChild(msgDiv);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    // SEND DIRECT MESSAGE
    chatForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = messageInput.value.trim();
      if (!text || !activeChatRoomId) return;

      const messageData = {
        senderId: myClientId,
        senderName: currentUsername,
        text: text,
        timestamp: firebase.database.ServerValue.TIMESTAMP
      };

      db.ref(`direct_messages/${activeChatRoomId}`).push(messageData);
      messageInput.value = '';
    });

    // PROFILE MODAL LOGIC
    openProfileBtn.addEventListener('click', () => {
      modalUsernameInput.value = currentUsername;
      profileModal.classList.remove('hidden');
    });

    closeModalBtn.addEventListener('click', () => {
      profileModal.classList.add('hidden');
    });

    saveProfileBtn.addEventListener('click', () => {
      const newUsername = modalUsernameInput.value.trim();
      if (!newUsername) return;

      localStorage.setItem('chatsphere_username', newUsername);
      currentUsername = newUsername;
      displayMyUsername.textContent = currentUsername;

      // Update Global Online Presence Name
      db.ref(`global_online_users/${myClientId}`).update({ name: currentUsername });

      profileModal.classList.add('hidden');
    });

    function escapeHTML(str) {
      return (str || '').replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }
  </script>
</body>
</html>
